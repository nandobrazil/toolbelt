server {
  listen 8080;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /download {
    add_header Cache-Control "no-store" always;
    return 302 https://github.com/nandobrazil/toolbelt/releases/latest/download/Toolbelt.dmg;
  }

  location = /updates/latest.json {
    add_header Cache-Control "no-store" always;
    return 302 https://github.com/nandobrazil/toolbelt/releases/latest/download/latest.json;
  }

  location = /changelog {
    return 302 https://github.com/nandobrazil/toolbelt/releases;
  }

  location ~* \.(css|js)$ {
    expires 1h;
  }

  location ~* \.(woff2|png|jpg|webp|avif|svg|ico)$ {
    expires 7d;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
