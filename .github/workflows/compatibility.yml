name: Compatibilidade e release

on:
  push:
    branches: [main]
    paths:
      - Sources/**
      - Tests/**
      - Resources/**
      - bin/**
      - Package.swift
      - VERSION
      - CHANGELOG.md
      - scripts/assemble-app.sh
      - scripts/release.sh
      - scripts/publish-release.sh
      - .github/workflows/compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Versões
        run: |
          sw_vers
          swift --version

      - name: Build de release
        run: swift build -c release

      - name: Testes
        run: swift test

      - name: Abrir o app montado por 20 s
        run: |
          scripts/assemble-app.sh "$(swift build -c release --show-bin-path)/Toolbelt" "$RUNNER_TEMP/Toolbelt.app"
          "$RUNNER_TEMP/Toolbelt.app/Contents/MacOS/Toolbelt" &
          PID=$!
          sleep 20
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "o Toolbelt fechou sozinho antes de 20 s"
            ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5
            exit 1
          fi
          kill -TERM "$PID"
          wait "$PID" || true
          tail -20 ~/Library/Logs/Toolbelt.log 2>/dev/null || true

  release:
    name: Release
    needs: [macos]
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tem versão nova?
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION já está publicada: nada a fazer"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif ! grep -q "^## $VERSION" CHANGELOG.md; then
            echo "::warning::VERSION $VERSION não tem seção no CHANGELOG.md; nada publicado"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicando v$VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Certificado Developer ID num keychain temporário
        if: steps.version.outputs.publish == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application"

      - name: Build universal, assinatura, notarização e DMG
        if: steps.version.outputs.publish == 'true'
        env:
          TOOLBELT_RADAR_KEY: ${{ secrets.RADAR_KEY }}
          TOOLBELT_NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TOOLBELT_NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          TOOLBELT_NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: scripts/release.sh

      - name: Publicar no toolbelt-releases e criar a tag
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/publish-release.sh

      - name: Marcar a release no Radar
        if: steps.version.outputs.publish == 'true'
        env:
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUILD="$(git rev-list --count HEAD)"
          NOW="$(($(date +%s) * 1000))"
          curl -sS -o /dev/null -w 'radar -> %{http_code}\n' -X POST https://radar-ingest.oconde.dev/api/v1/events \
            -H "Authorization: Bearer $RADAR_KEY" -H "Content-Type: application/json" \
            -d "{\"v\":1,\"sdk\":{\"name\":\"toolbelt-release\",\"version\":\"$VERSION\"},\"environment\":\"production\",\"release\":\"$VERSION+$BUILD\",\"events\":[{\"type\":\"log\",\"ts\":$NOW,\"level\":\"info\",\"message\":\"release.published\",\"attrs\":{\"version\":\"$VERSION\",\"build\":$BUILD,\"commit\":\"${GITHUB_SHA::7}\"}}]}"

      - name: Apagar o keychain temporário
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
