name: Deploy da landing

on:
  push:
    branches: [main]
    paths:
      - site/**
      - infra/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  image:
    name: Imagem no GHCR
    needs: [secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        env:
          IMAGE: ghcr.io/nandobrazil/toolbelt-site:${{ steps.meta.outputs.sha }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE já existe"
            exit 0
          fi
          docker build --build-arg GIT_SHA="$SHA" -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    name: Deploy na VPS de produção
    needs: [image]
    runs-on: [self-hosted, oconde-vps]
    concurrency:
      group: release-production
      cancel-in-progress: false
    env:
      SHA: ${{ needs.image.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Release atual
        run: |
          echo "no ar antes: $(bash infra/running-release.sh || true)"

      - name: Rollout
        run: bash infra/deploy.sh "ghcr.io/nandobrazil/toolbelt-site:$SHA"

      - name: Release no ar e rotas
        run: bash infra/smoke.sh "$SHA"
